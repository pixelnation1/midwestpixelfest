name: Build Android attendee guide
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-guide.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p android :app:assembleDebug :app:lintDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Midwest-PixelFest-Android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
